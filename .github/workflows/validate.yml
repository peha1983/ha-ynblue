name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: HACS release package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build HACS package
        run: bash scripts/build-hacs-zip.sh "$RUNNER_TEMP/ynblue.zip"
      - name: Inspect package contents
        run: unzip -l "$RUNNER_TEMP/ynblue.zip"

  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: HA 2026.6.4 (minimum/live)
            python-version: "3.14"
            requirements: requirements_test_ha_2026_6.txt
          - name: HA 2026.8.1 (login regression)
            python-version: "3.14"
            requirements: requirements_test.txt
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "${{ matrix.requirements }}"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
